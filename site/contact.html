<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POC Demo Site — Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">POC Demo Site</a>
      <nav class="nav">
        <a href="index.html" id="nav-home">Home</a>
        <a href="login.html" id="nav-login">Login</a>
        <a href="contact.html" id="nav-contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container main narrow">
    <h1 id="page-heading">Contact us</h1>
    <p class="lead">Fill the form — Robot Framework can type into every field.</p>

    <form id="contact-form" class="form" novalidate>
      <label for="contact-name">Name</label>
      <input type="text" id="contact-name" name="name" placeholder="Your name">

      <label for="contact-email">Email</label>
      <input type="email" id="contact-email" name="email" placeholder="you@example.com">

      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="4" placeholder="Hello from automation"></textarea>

      <button type="submit" class="btn btn-primary" id="contact-submit">Send message</button>
    </form>

    <p id="contact-success" class="success-msg hidden" role="status">Message sent! (demo — nothing is stored)</p>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
